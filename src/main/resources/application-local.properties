# Local IPD - shared accommodation + clinical DB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ipddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
security.jwt.enforce=false
# Local Maven: no Config Server / Eureka (Docker maps often differ from :8888/:8761)
spring.cloud.config.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
accommodation.service.base-url=${ACCOMMODATION_SERVICE_BASE_URL:http://localhost:8101}
order.service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8083}
order.billing.sync-enabled=${ORDER_BILLING_SYNC_ENABLED:true}
security.jwt.internal-api-key=${SECURITY_INTERNAL_API_KEY:${SECURITY_INVITE_INTERNAL_KEY:dev-invite-key-change-in-production}}
