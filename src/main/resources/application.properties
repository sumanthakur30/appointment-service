spring.application.name=ipd-service
server.port=${SERVER_PORT:8100}
# Overridable for local Maven: set SPRING_CONFIG_IMPORT=optional:classpath:/ to skip Config Server
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ipddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_ipd
management.endpoints.web.exposure.include=health,info
security.jwt.enforce=${SECURITY_JWT_ENFORCE:true}
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.internal-api-key=${SECURITY_INTERNAL_API_KEY:${SECURITY_INVITE_INTERNAL_KEY:}}
ipd.billing.daily-enabled=${IPD_BILLING_DAILY_ENABLED:true}
ipd.billing.timezone=${IPD_BILLING_TIMEZONE:Asia/Kolkata}
ipd.billing.daily-cron=${IPD_BILLING_DAILY_CRON:0 5 0 * * *}
order.service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8083}
order.billing.sync-enabled=${ORDER_BILLING_SYNC_ENABLED:true}
stock.service.base-url=${STOCK_SERVICE_BASE_URL:http://localhost:8082}
stock.mar.link-enabled=${STOCK_MAR_LINK_ENABLED:true}
accommodation.service.base-url=${ACCOMMODATION_SERVICE_BASE_URL:http://localhost:8101}
accommodation.service.enabled=${ACCOMMODATION_SERVICE_ENABLED:true}
forms.service.base-url=${FORMS_SERVICE_BASE_URL:http://localhost:8183}
forms.service.enabled=${FORMS_SERVICE_ENABLED:true}
ipd.forms.assessment-key=${IPD_FORMS_ASSESSMENT_KEY:ipd_nursing_assessment}
ipd.forms.consent-key=${IPD_FORMS_CONSENT_KEY:ipd_admission_consent}
ipd.forms.discharge-summary-key=${IPD_FORMS_DISCHARGE_SUMMARY_KEY:ipd_discharge_summary}
ipd.lab.link-enabled=${IPD_LAB_LINK_ENABLED:true}
ipd.family.public-base-url=${IPD_FAMILY_PUBLIC_BASE_URL:http://localhost:4200}
