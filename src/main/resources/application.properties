spring.application.name=ipd-service
server.port=${SERVER_PORT:8100}
# Overridable for local Maven: set SPRING_CONFIG_IMPORT=optional:classpath:/ to skip Config Server
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ipddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_ipd
management.endpoints.web.exposure.include=health,info
services.queue.base-url=${SERVICES_QUEUE_BASE_URL:http://localhost:8098}
services.order.base-url=${SERVICES_ORDER_BASE_URL:http://localhost:8083}
security.jwt.enforce=${SECURITY_JWT_ENFORCE:true}
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.internal-api-key=${SECURITY_INTERNAL_API_KEY:${SECURITY_INVITE_INTERNAL_KEY:}}
ipd.billing.daily-enabled=${IPD_BILLING_DAILY_ENABLED:true}
ipd.billing.timezone=${IPD_BILLING_TIMEZONE:Asia/Kolkata}
ipd.billing.daily-cron=${IPD_BILLING_DAILY_CRON:0 5 0 * * *}
order.service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8083}
order.billing.sync-enabled=${ORDER_BILLING_SYNC_ENABLED:true}
order.billing.settlement-sync-enabled=${ORDER_BILLING_SETTLEMENT_SYNC_ENABLED:true}
stock.service.base-url=${STOCK_SERVICE_BASE_URL:http://localhost:8082}
stock.mar.link-enabled=${STOCK_MAR_LINK_ENABLED:true}
accommodation.service.base-url=${ACCOMMODATION_SERVICE_BASE_URL:http://localhost:8101}
accommodation.service.enabled=${ACCOMMODATION_SERVICE_ENABLED:true}
forms.service.base-url=${FORMS_SERVICE_BASE_URL:http://localhost:8183}
forms.service.enabled=${FORMS_SERVICE_ENABLED:true}
ipd.forms.assessment-key=${IPD_FORMS_ASSESSMENT_KEY:ipd_nursing_assessment}
ipd.forms.consent-key=${IPD_FORMS_CONSENT_KEY:ipd_admission_consent}
ipd.forms.discharge-summary-key=${IPD_FORMS_DISCHARGE_SUMMARY_KEY:ipd_discharge_summary}
ipd.forms.who-checklist-key=${IPD_FORMS_WHO_CHECKLIST_KEY:ipd_who_surgical_checklist}
ipd.forms.tpa-claim-key=${IPD_FORMS_TPA_CLAIM_KEY:ipd_tpa_claim}
ipd.lab.link-enabled=${IPD_LAB_LINK_ENABLED:true}
ipd.family.public-base-url=${IPD_FAMILY_PUBLIC_BASE_URL:http://localhost:4200}
# MAR five-rights / barcode (config toggles; no school-specific code)
ipd.mar.barcode-required=${IPD_MAR_BARCODE_REQUIRED:false}
ipd.mar.five-rights-enabled=${IPD_MAR_FIVE_RIGHTS_ENABLED:true}
# TPA claim template default (GENERIC | STAR_HEALTH | NIVA_BUPA — overridable per admission)
ipd.tpa.default-claim-format=${IPD_TPA_DEFAULT_CLAIM_FORMAT:GENERIC}
ipd.billing.settlement-enabled=${IPD_BILLING_SETTLEMENT_ENABLED:true}
ipd.forms.handover-key=${IPD_FORMS_HANDOVER_KEY:ipd_shift_handover}
ipd.forms.transfer-handoff-key=${IPD_FORMS_TRANSFER_HANDOFF_KEY:ipd_transfer_handoff}
ipd.lab.critical-paging-enabled=${IPD_LAB_CRITICAL_PAGING_ENABLED:true}
ipd.cpoe.order-sets-enabled=${IPD_CPOE_ORDER_SETS_ENABLED:true}
ipd.ipc.hai-registry-enabled=${IPD_IPC_HAI_REGISTRY_ENABLED:true}
# Wave P2+ toggles
ipd.icd.catalogue-enabled=${IPD_ICD_CATALOGUE_ENABLED:true}
ipd.diet.kitchen-enabled=${IPD_DIET_KITCHEN_ENABLED:true}
ipd.hl7.adt.enabled=${IPD_HL7_ADT_ENABLED:true}
ipd.hl7.adt.endpoint=${IPD_HL7_ADT_ENDPOINT:}
ipd.family.hours-rules-enabled=${IPD_FAMILY_HOURS_RULES_ENABLED:true}
ipd.icu.device-panel-enabled=${IPD_ICU_DEVICE_PANEL_ENABLED:true}
ipd.radiology.dicom-link-enabled=${IPD_RADIOLOGY_DICOM_LINK_ENABLED:true}
ipd.radiology.dicom-viewer-url-template=${IPD_RADIOLOGY_DICOM_VIEWER_URL:https://pacs.local/viewer?study={studyUid}}
ipd.quality.indicators-enabled=${IPD_QUALITY_INDICATORS_ENABLED:true}
# Wave D ecosystem toggles (config-driven; disable without code changes)
ipd.fhir.enabled=${IPD_FHIR_ENABLED:true}
ipd.abha.enabled=${IPD_ABHA_ENABLED:true}
ipd.abha.mode=${IPD_ABHA_MODE:sandbox}
ipd.blood.enabled=${IPD_BLOOD_ENABLED:true}
ipd.cssd.enabled=${IPD_CSSD_ENABLED:true}
ipd.controlled-drugs.enabled=${IPD_CONTROLLED_DRUGS_ENABLED:true}
ipd.floor-stock.enabled=${IPD_FLOOR_STOCK_ENABLED:true}
ipd.nursing.handover-board-enabled=${IPD_NURSING_HANDOVER_BOARD_ENABLED:true}
