# Production — JDBC via SPRING_DATASOURCE_* environment variables only (no secrets in git).
# Dedicated Flyway history table (shared ipddb with accommodation-service).
spring.flyway.table=flyway_schema_history_ipd
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
security.jwt.enforce=true
